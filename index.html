<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>GSAT 암산 훈련</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#17243c;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:480px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 20px 32px}h1{font-size:30px;margin:8px 0}p{color:#64748b;line-height:1.6}small{color:#64748b}section{background:white;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 4px 20px #1b31500b}button,select{font:inherit;border:0;border-radius:13px;padding:15px;width:100%;margin:5px 0;background:#e9eef7;color:#17243c;font-weight:650;cursor:pointer}button.primary{background:#254fc4;color:white}button.good{background:#e1f5e9;color:#146638}button.bad{background:#ffe9e7;color:#a72c29}button:disabled{opacity:.4}.row{display:flex;gap:10px}.row>*{flex:1}.stat{font-size:25px;font-weight:750}.question{text-align:center;font-size:46px;font-weight:750;padding:35px 0 20px}.answer{text-align:center;font-size:35px;color:#254fc4;min-height:70px}progress{width:100%;accent-color:#254fc4;height:9px}input{width:100%;font:inherit;font-size:24px;text-align:center;padding:14px;border:1px solid #cbd5e1;border-radius:12px} .hidden{display:none} #feedback{text-align:center;min-height:28px} .item{padding:10px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between} </style><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-title" content="GSAT 암산"><meta name="theme-color" content="#17243c"></head><body><main><small>GSAT · MENTAL MATH</small><h1>암산 훈련</h1><a href="mock.html" style="display:block;background:#17243c;color:white;padding:16px;border-radius:14px;text-decoration:none;font-weight:bold;margin:16px 0">실전 모의고사 · 수리 / 추리 / 지각 →</a><p>하루 5분, 계산 속도를 높여보자.</p><section id="home"><div class="row"><div><small>암기 완료</small><div class="stat" id="known">0 / 30</div></div><div><small>복습 필요</small><div class="stat" id="missed">25</div></div></div><progress id="master" max="30" value="0"></progress><p id="storage"></p><label>문제 유형<select id="category"><option value="all">전체 30문제</option><option value="power">거듭제곱</option><option value="factor">팩토리얼</option><option value="percent">분수 → 백분율</option></select></label><label>훈련 방식<select id="mode"><option value="type">직접 정답 입력</option><option value="card">암기 카드 (정답 확인 후 채점)</option></select></label><button class="primary" id="start">랜덤 훈련 시작</button><button id="wrong">오답만 복습</button><button id="table">전체 암기표 보기</button></section><section id="quiz" class="hidden"><div class="row"><small id="count"></small><small style="text-align:right" id="timer">0.0초</small></div><progress id="progress" value="0"></progress><div class="question" id="q"></div><div id="typing"><form id="form"><input id="entry" inputmode="decimal" autocomplete="off" placeholder="정답 입력" aria-label="정답"><button class="primary" id="submit">정답 제출</button></form><button id="skip">모르겠어요</button></div><div id="feedback" aria-live="polite"></div><div class="answer hidden" id="answer"></div><button id="reveal" class="primary hidden">정답 확인</button><div id="grade" class="row hidden"><button class="bad" id="no">다시 연습</button><button class="good" id="yes">알고 있어요</button></div><button id="next" class="primary hidden">다음 문제</button><button id="quit">처음으로</button></section><section id="result" class="hidden"><h2>훈련 완료!</h2><div id="summary"></div><div id="errors"></div><button class="primary" id="retry">이번 오답 다시 풀기</button><button id="again">처음으로</button></section><section id="reference" class="hidden"><h2>전체 암기표</h2><div id="list"></div><button id="back">처음으로</button></section></main><script>
const raw=[['2³',8],['3⁴',81],['4⁵',1024],['3!',6],['1/8',12.5],['2⁷',128],['3³',27],['4⁴',256],['5!',120],['1/6',16.67],['2⁵',32],['3⁵',243],['4³',64],['4!',24],['1/16',6.25],['2⁸',256],['3⁶',729],['4⁶',4096],['6!',720],['1/12',8.33],['2⁶',64],['3²',9],['4²',16],['5³',125],['1/9',11.11],['2⁴',16],['2¹⁰',1024],['5⁴',625],['3/8',37.5],['7/8',87.5]];const cards=raw.map(([q,a],i)=>({q,a,i,c:q.includes('/')?'percent':q.includes('!')?'factor':'power'}));const $=id=>document.getElementById(id);let history=Object.fromEntries(cards.map(c=>[c.i,[0,3,21,22,29].includes(c.i)?'known':'missed']));let persistent=true;try{let old=localStorage.getItem('gsat-v1');if(old)history=JSON.parse(old)}catch(e){persistent=false}let deck=[],pos=0,correct=0,errors=[],times=[],started=0,clock=null,locked=false,mode='type';const show=id=>{for(const x of ['home','quiz','result','reference'])$(x).classList.toggle('hidden',x!==id)};const hide=(id,b)=>$(id).classList.toggle('hidden',b);const answer=c=>c.a+(c.c==='percent'?'%':'');function save(){try{localStorage.setItem('gsat-v1',JSON.stringify(history))}catch(e){persistent=false}}function home(){clearInterval(clock);show('home');let k=Object.values(history).filter(v=>v==='known').length,m=Object.values(history).filter(v=>v==='missed').length;$('known').textContent=k+' / 30';$('missed').textContent=m;$('master').value=k;$('storage').textContent=persistent?'이전 카드 복습 결과를 반영했어요.':'이 환경에서는 기록 저장이 제한될 수 있어요.'}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(wrong=false,subset=null){let cat=$('category').value;deck=shuffle(subset||cards.filter(c=>(cat==='all'||c.c===cat)&&(!wrong||history[c.i]==='missed')));if(!deck.length){alert('복습할 문제가 없어요!');return}mode=$('mode').value;pos=correct=0;errors=[];times=[];show('quiz');load()}function load(){clearInterval(clock);locked=false;let c=deck[pos];$('count').textContent=(pos+1)+' / '+deck.length;$('progress').max=deck.length;$('progress').value=pos;$('q').textContent=c.q+(c.c==='percent'?' → %':'');$('answer').textContent=answer(c);$('feedback').textContent='';$('entry').value='';hide('typing',mode!=='type');hide('reveal',mode!=='card');hide('answer',true);hide('grade',true);hide('next',true);started=Date.now();$('timer').textContent='0.0초';clock=setInterval(()=>{$('timer').textContent=((Date.now()-started)/1000).toFixed(1)+'초'},100)}function stop(){clearInterval(clock);return (Date.now()-started)/1000}function grade(ok,elapsed){if(locked)return;locked=true;times.push(elapsed);let c=deck[pos];history[c.i]=ok?'known':'missed';save();if(ok)correct++;else errors.push(c);$('feedback').textContent=ok?'정답!':'정답을 기억해 봐요.';hide('typing',true);hide('reveal',true);hide('grade',true);hide('answer',false);hide('next',false);$('next').textContent=pos===deck.length-1?'결과 보기':'다음 문제'}$('form').onsubmit=e=>{e.preventDefault();let v=$('entry').value.trim().replace('%','');if(!v||!Number.isFinite(Number(v)))return;let c=deck[pos];grade(Math.abs(Number(v)-c.a)<(c.c==='percent'?0.006:0.00001),stop())};$('skip').onclick=()=>grade(false,stop());let revealedTime=0;$('reveal').onclick=()=>{revealedTime=stop();hide('reveal',true);hide('answer',false);hide('grade',false)};$('yes').onclick=()=>grade(true,revealedTime);$('no').onclick=()=>grade(false,revealedTime);$('next').onclick=()=>{if(++pos<deck.length)load();else finish()};function finish(){show('result');let total=times.reduce((a,b)=>a+b,0);$('summary').innerHTML='<div class="stat">'+correct+' / '+deck.length+' 정답</div><p>정답률 '+Math.round(correct/deck.length*100)+'% · 총 '+total.toFixed(1)+'초 · 평균 '+(total/deck.length).toFixed(1)+'초</p>';$('errors').innerHTML=errors.length?'<h3>이번 오답</h3>'+errors.map(c=>'<div class="item"><span>'+c.q+'</span><strong>'+answer(c)+'</strong></div>').join(''):'<p>모두 맞혔어요!</p>';$('retry').disabled=!errors.length} $('start').onclick=()=>start();$('wrong').onclick=()=>start(true);$('retry').onclick=()=>start(false,[...errors]);$('quit').onclick=home;$('again').onclick=home;$('back').onclick=home;$('table').onclick=()=>{show('reference');$('list').innerHTML=['power','factor','percent'].map((cat,i)=>'<h3>'+['거듭제곱','팩토리얼','백분율'][i]+'</h3>'+cards.filter(c=>c.c===cat).map(c=>'<div class="item"><span>'+c.q+'</span><strong>'+answer(c)+'</strong></div>').join('')).join('')};home();</script></body></html>
