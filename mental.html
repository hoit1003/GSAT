<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>GSAT 암산 훈련</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#17243c;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 20px 32px}h1{font-size:30px;margin:8px 0}p{color:#64748b;line-height:1.6}small{color:#64748b}section{background:white;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 4px 20px #1b31500b}button,select{font:inherit;border:0;border-radius:13px;padding:15px;width:100%;margin:5px 0;background:#e9eef7;color:#17243c;font-weight:650;cursor:pointer}button.primary{background:#254fc4;color:white}button.good{background:#e1f5e9;color:#146638}button.bad{background:#ffe9e7;color:#a72c29}button:disabled{opacity:.4}.row{display:flex;gap:10px}.row>*{flex:1}.stat{font-size:25px;font-weight:750}.question{text-align:center;font-size:46px;font-weight:750;padding:35px 0 20px}.answer{text-align:center;font-size:35px;color:#254fc4;min-height:70px}progress{width:100%;accent-color:#254fc4;height:9px}input{width:100%;font:inherit;font-size:24px;text-align:center;padding:14px;border:1px solid #cbd5e1;border-radius:12px} .hidden{display:none} #feedback{text-align:center;min-height:28px} .item{padding:10px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between} </style><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-title" content="GSAT 암산"><meta name="theme-color" content="#0c111b"><link rel="stylesheet" href="theme.css?v=34"><script src="config.js?v=3"></script><script src="sync.js?v=34"></script></head><body><main><a class="toplink" href="index.html?v=34">‹ GSAT 홈</a><small>GSAT · MENTAL MATH</small><h1>암산 훈련</h1><p>하루 5분, 계산 속도를 높여보자.</p><section id="home"><div class="row"><div><small>암기 완료</small><div class="stat" id="known">0 / 100</div></div><div><small>복습 필요</small><div class="stat" id="missed">0</div></div></div><progress id="master" max="100" value="0"></progress><p id="storage"></p><label>문제 유형<select id="category"><option value="all">전체 100문제</option><option value="power">거듭제곱</option><option value="square">제곱수</option><option value="combo">순열·조합</option><option value="factor">팩토리얼</option><option value="percent">분수 → 백분율</option></select></label><label>훈련 방식<select id="mode"><option value="type">직접 정답 입력</option><option value="card">암기 카드 (정답 확인 후 채점)</option></select></label><button class="primary" id="start">랜덤 훈련 시작</button><button id="wrong">오답만 복습</button><button id="learningStart">학습 중인 문제 복습 (1~2회 정답)</button><button id="table">전체 암기표 보기</button><div class="item"><span>미학습</span><strong id="unseen">100</strong></div><div class="item"><span>학습 중 (1~2회 연속 정답)</span><strong id="learning">0</strong></div><h2>랜덤 암산 · 타임 어택</h2><label>계산 유형<select id="randomKind"><option value="all">혼합</option><option value="mul">두 자릿수 곱셈</option><option value="add">덧셈·뺄셈</option><option value="div">나눗셈</option><option value="frac">분수 약분</option><option value="compare">분수 비교</option><option value="pct">백분율·증감률</option><option value="avg">평균</option></select></label><label>시간<select id="limit"><option value="0">무제한</option><option value="30">30초</option><option value="60">60초</option><option value="180">180초</option></select></label><button class="primary" id="randomStart">랜덤 암산 시작</button><p id="randomStats"></p></section><section id="quiz" class="hidden"><div class="row"><small id="count"></small><small style="text-align:right" id="timer">0.0초</small></div><progress id="progress" value="0"></progress><div class="question" id="q"></div><div id="typing"><form id="form"><input id="entry" inputmode="decimal" autocomplete="off" placeholder="정답 입력" aria-label="정답"><button class="primary" id="submit">정답 제출</button></form><button id="skip">모르겠어요</button></div><div id="feedback" aria-live="polite"></div><div class="answer hidden" id="answer"></div><button id="reveal" class="primary hidden">정답 확인</button><div id="grade" class="row hidden"><button class="bad" id="no">다시 연습</button><button class="good" id="yes">알고 있어요</button></div><button id="next" class="primary hidden">다음 문제</button><button id="quit">처음으로</button></section><section id="result" class="hidden"><h2>훈련 완료!</h2><div id="summary"></div><div id="errors"></div><button class="primary" id="retry">이번 오답 다시 풀기</button><button id="again">처음으로</button></section><section id="reference" class="hidden"><h2>전체 암기표</h2><div id="list"></div><button id="back">처음으로</button></section></main><script>
const raw=[['2³',8],['3⁴',81],['4⁵',1024],['3!',6],['1/8',12.5],['2⁷',128],['3³',27],['4⁴',256],['5!',120],['1/6',16.67],['2⁵',32],['3⁵',243],['4³',64],['4!',24],['1/16',6.25],['2⁸',256],['3⁶',729],['4⁶',4096],['6!',720],['1/12',8.33],['2⁶',64],['3²',9],['4²',16],['5³',125],['1/9',11.11],['2⁴',16],['2¹⁰',1024],['5⁴',625],['3/8',37.5],['7/8',87.5]];const supers=n=>String(n).split('').map(x=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[Number(x)]).join('');
function add(q,a,c){if(!raw.some(x=>x[0]===q))raw.push([q,a,c])}
for(let b=2;b<=5;b++){let end={2:10,3:7,4:6,5:5}[b];for(let e=2;e<=end;e++)add(b+supers(e),Math.pow(b,e),'power')}
for(let n=11;n<=30;n++)add(n+'²',n*n,'square');
let fac=1;for(let n=1;n<=10;n++){fac*=n;if(n>=2)add(n+'!',fac,'factor')}
let fractions=['1/2','1/3','2/3','1/4','3/4','1/5','2/5','3/5','4/5','1/6','5/6','1/7','1/8','3/8','5/8','7/8','1/9','2/9','4/9','1/10','3/10','7/10','9/10','1/12','5/12','7/12','11/12','1/16','3/16','1/20'];for(let q of fractions){let a=q.split('/').map(Number);add(q,Math.round(a[0]/a[1]*10000)/100,'percent')}
function comb(n,r){let v=1;for(let i=1;i<=r;i++)v=v*(n-i+1)/i;return Math.round(v)}
for(let n=3;n<=10;n++)for(let r=2;r<=Math.min(3,n-1);r++)add(n+'C'+r,comb(n,r),'combo');for(let n=4;raw.length<100;n++)add(n+'P2',n*(n-1),'combo');
const cards=raw.slice(0,100).map(([q,a,c],i)=>({q,a,i,c:c||(q.includes('/')?'percent':q.includes('!')?'factor':'power')}));const $=id=>document.getElementById(id);let history={};let persistent=true;try{let old=GSATSync.get('gsat-v1');if(old)history=JSON.parse(old)}catch(e){persistent=false}Object.keys(history).forEach(k=>{if(history[k]==='known')history[k]=1;else if(history[k]==='missed')history[k]=0});let randomRun=false,deadline=0,randomKind='all';let deck=[],pos=0,correct=0,errors=[],times=[],started=0,clock=null,locked=false,mode='type';const show=id=>{for(const x of ['home','quiz','result','reference'])$(x).classList.toggle('hidden',x!==id)};const hide=(id,b)=>$(id).classList.toggle('hidden',b);const answer=c=>c.a+(c.c==='percent'?'%':'');function save(){try{GSATSync.set('gsat-v1',JSON.stringify(history));if(window.GSATSync)GSATSync.changed('gsat-v1')}catch(e){persistent=false}}function home(){clearInterval(clock);show('home');let k=cards.filter(c=>Number(history[c.i])>=3).length,m=cards.filter(c=>history[c.i]===0).length; $('unseen').textContent=cards.filter(c=>history[c.i]===undefined).length;$('learning').textContent=cards.filter(c=>history[c.i]===1||history[c.i]===2).length;let rs=history._random||{n:0,c:0,t:0};$('randomStats').textContent='랜덤 누적 '+rs.n+'문제 · 정답률 '+(rs.n?Math.round(rs.c/rs.n*100):0)+'% · 평균 '+(rs.n?(rs.t/rs.n).toFixed(1):'0')+'초';$('known').textContent=k+' / 100';$('missed').textContent=m;$('master').value=k;$('storage').textContent=persistent?'연속 3회 정답이면 암기 완료. 백분율은 소수 둘째 자리까지 입력하세요.':'이 환경에서는 기록 저장이 제한될 수 있어요.'}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(wrong=false,subset=null){randomRun=false;deadline=0;let cat=$('category').value;deck=shuffle(subset||cards.filter(c=>(cat==='all'||c.c===cat)&&(!wrong||history[c.i]===0)));if(!deck.length){alert('복습할 문제가 없어요!');return}mode=$('mode').value;pos=correct=0;errors=[];times=[];show('quiz');load()}function load(){clearInterval(clock);locked=false;let c=deck[pos];$('count').textContent=randomRun?(pos+1)+'번 · 랜덤':(pos+1)+' / '+deck.length;$('progress').max=deck.length;$('progress').value=pos;$('q').textContent=c.q+(c.c==='percent'?' → %':'');$('answer').textContent=answer(c);$('feedback').textContent='';$('entry').value='';$('entry').inputMode=typeof c.a==='string'?'text':'decimal';hide('typing',mode!=='type');hide('reveal',mode!=='card');hide('answer',true);hide('grade',true);hide('next',true);started=Date.now();$('timer').textContent='0.0초';clock=setInterval(()=>{if(randomRun&&deadline&&Date.now()>=deadline){finish();return}$('timer').textContent=deadline?'남은 '+Math.max(0,Math.ceil((deadline-Date.now())/1000))+'초':((Date.now()-started)/1000).toFixed(1)+'초'},100)}function stop(){clearInterval(clock);return (Date.now()-started)/1000}function grade(ok,elapsed){if(locked)return;locked=true;times.push(elapsed);let c=deck[pos];if(randomRun){let rs=history._random||(history._random={n:0,c:0,t:0});rs.n++;rs.c+=ok?1:0;rs.t+=elapsed}else history[c.i]=ok?Math.min(3,(Number(history[c.i])||0)+1):0;save();if(ok)correct++;else errors.push(c);$('feedback').textContent=randomRun?(ok?'정답!':'정답을 기억해 봐요.'):(ok?(history[c.i]>=3?'정답! 암기 완료 (3/3)':'정답! 연속 '+history[c.i]+'/3'):'오답 · 연속 정답 초기화 (0/3)');hide('typing',true);hide('reveal',true);hide('grade',true);hide('answer',false);hide('next',false);$('next').textContent=!randomRun&&pos===deck.length-1?'결과 보기':'다음 문제'}$('form').onsubmit=e=>{e.preventDefault();let v=$('entry').value.trim().replace(/%/g,'').replace(/\s/g,'');let c=deck[pos];if(typeof c.a==='string'){if(v)grade(v===c.a,stop());return}if(!v||!Number.isFinite(Number(v)))return;grade(Math.abs(Number(v)-c.a)<(c.c==='percent'?0.006:0.00001),stop())};$('skip').onclick=()=>grade(false,stop());let revealedTime=0;$('reveal').onclick=()=>{revealedTime=stop();hide('reveal',true);hide('answer',false);hide('grade',false)};$('yes').onclick=()=>grade(true,revealedTime);$('no').onclick=()=>grade(false,revealedTime);$('next').onclick=()=>{if(randomRun){pos++;deck.push(makeRandom());load()}else if(++pos<deck.length)load();else finish()};function finish(){clearInterval(clock);show('result');let count=times.length;let total=times.reduce((a,b)=>a+b,0);$('summary').innerHTML='<div class="stat">'+correct+' / '+(randomRun?count:deck.length)+' 정답</div><p>정답률 '+Math.round(correct/Math.max(1,count)*100)+'% · 총 '+total.toFixed(1)+'초 · 평균 '+(total/Math.max(1,count)).toFixed(1)+'초</p>';$('errors').innerHTML=errors.length?'<h3>이번 오답</h3>'+errors.map(c=>'<div class="item"><span>'+c.q+'</span><strong>'+answer(c)+'</strong></div>').join(''):'<p>모두 맞혔어요!</p>';$('retry').disabled=!errors.length||randomRun} $('start').onclick=()=>start();$('wrong').onclick=()=>start(true);$('learningStart').onclick=()=>{let cat=$('category').value;start(false,cards.filter(c=>(cat==='all'||c.c===cat)&&(history[c.i]===1||history[c.i]===2)))};$('retry').onclick=()=>start(false,[...errors]);$('quit').onclick=home;$('again').onclick=home;$('back').onclick=home;$('table').onclick=()=>{show('reference');$('list').innerHTML=['power','square','factor','percent','combo'].map((cat,i)=>'<h3>'+['거듭제곱','제곱수','팩토리얼','백분율','순열·조합'][i]+'</h3>'+cards.filter(c=>c.c===cat).map(c=>'<div class="item"><span>'+c.q+'</span><strong>'+answer(c)+'</strong></div>').join('')).join('')};function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}function makeRandom(){let t=randomKind==='all'?['mul','add','div','frac','compare','pct','avg'][rnd(0,6)]:randomKind,a=rnd(12,49),b=rnd(11,35),q='',ans=0;if(t==='mul'){q=a+' × '+b;ans=a*b}else if(t==='add'){let x=rnd(100,999),y=rnd(100,999);q=x+' + '+y;ans=x+y;if(rnd(0,1)){q=Math.max(x,y)+' − '+Math.min(x,y);ans=Math.abs(x-y)}}else if(t==='div'){q=a*b+' ÷ '+a;ans=b}else if(t==='frac'){let x=rnd(2,8),y=rnd(x+1,12),k=rnd(2,9);function gcd(a,b){return b?gcd(b,a%b):a}let g=gcd(x,y);q=x*k+'/'+y*k+' 약분 (a/b)';ans=(x/g)+'/'+(y/g)}else if(t==='compare'){let x=rnd(2,9),y=rnd(x+1,18),z=rnd(2,9),w=rnd(z+1,18);q=x+'/'+y+' ? '+z+'/'+w+' (>, <, =)';ans=x*w>z*y?'>':x*w<z*y?'<':'='}else if(t==='pct'){let x=rnd(2,18)*10,k=rnd(1,5)*10;q=x+'의 '+k+'%';ans=x*k/100}else{let x=rnd(10,99),d=rnd(1,9);q=x+' · '+(x+d)+' · '+(x+2*d)+'의 평균';ans=x+d}return {q:q,a:ans,c:'random'}}$('randomStart').onclick=function(){randomRun=true;randomKind=$('randomKind').value;let sec=Number($('limit').value);deadline=sec?Date.now()+sec*1000:0;mode='type';deck=[makeRandom()];pos=correct=0;errors=[];times=[];show('quiz');load()};home();</script></body></html>
