gen['숫자 배열']=()=>{let s=str(9,'0123456789'),format=x=>x.slice(0,3)+'-'+x.slice(3,5)+'-'+x.slice(5),w=new Set;while(w.size<3)w.add(format(mut(s,'0123456789')));return Q('숫자 배열','제시된 숫자 배열과 같은 것을 고르시오.',format(s),[...w],'숫자를 구간별로 나누어 비교하면 빠르다. 정답 '+format(s),`<div class="mono">${format(s)}</div>`)};
gen['다른 배열 찾기']=()=>{let chars=pick(['가나다라마바사아자차카타파하','abcdefghijklmnopqrstuvwxyz']),a=range(4).map(()=>str(8,chars)),i=R(0,3),rows=a.map((s,j)=>s+' / '+(i===j?mut(s,chars):s));return Q('다른 배열 찾기','좌우 배열이 서로 다른 것을 고르시오.',rows[i],rows.filter((_,j)=>j!==i),'정답 배열만 좌우 중 한 글자가 다르다. '+rows[i])};
gen['숫자 범주']=()=>{let start=R(10000,20000),bounds=[start];for(let i=0;i<4;i++)bounds.push(bounds[i]+R(3000,12000));let order=sh(range(4)),j=R(0,3),v=R(bounds[j],bounds[j+1]-1),ans=order.indexOf(j)+1;return Q('숫자 범주',`다음 숫자 ${v}가 속하는 범주는?`,ans,[1,2,3,4],`${bounds[j]}~${bounds[j+1]-1} 구간은 ${ans}번이다.`,table(['범주','기준'],order.map((x,i)=>[i+1,`${bounds[x]}~${bounds[x+1]-1}`])),true)};
const shape=s=>'<div class="shape">'+[...s].map(c=>'<span>'+c+'</span>').join('')+'</div>';
function shapeQ(odd){let chars='↑↓←→◢◣◤◥●○',a=str(9,chars),w=new Set;while(w.size<3)w.add(mut(a,chars));let options=odd?sh([a,a,a,[...w][0]]):sh([a,...w]);let idx=odd?options.findIndex(v=>v!==a):options.indexOf(a);return {type:odd?'다른 도형':'같은 도형',text:odd?'네 도형 중 다른 하나를 고르시오.':'제시 도형과 완전히 같은 도형을 고르시오.',ans:String(idx+1),opts:range(4).map(i=>String(i+1)),visual:options.map(shape),stim:odd?'':shape(a),ex:`${idx+1}번이 정답이다. 각 칸의 방향과 채움 여부를 비교한다.`}}
gen['다른 도형']=()=>shapeQ(true);gen['같은 도형']=()=>shapeQ(false);
function cubes(h){let n=h.length,m=h[0].length,svg='<svg viewBox="0 0 260 220" role="img" aria-label="쌓기 블록 그림">',pt=(x,y,z)=>[130+(x-y)*23,110+(x+y)*12-z*24],poly=(v,fill)=>'<polygon points="'+v.map(a=>pt(...a).join(',')).join(' ')+'" fill="'+fill+'" stroke="#25344a" stroke-width="1.1" stroke-linejoin="round"/>';for(let s=0;s<n+m-1;s++)for(let x=0;x<n;x++){let y=s-x;if(y<0||y>=m)continue;for(let z=0;z<h[x][y];z++){svg+=poly([[x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1]],'#a7b9d1');svg+=poly([[x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1]],'#d0dbe9');svg+=poly([[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]],'#f8fbff')}}return svg+'</svg>'}
gen['쌓기 블록']=()=>{let n=R(2,4),m=R(2,4),h=range(n).map(()=>range(m).map(()=>R(1,3))); // monotone towards back, every column top visible with chosen angle
for(let x=n-1;x>=0;x--)for(let y=m-1;y>=0;y--)h[x][y]=Math.max(h[x][y],h[x+1]?.[y]||0,h[x][y+1]||0);let a=sum(h.flat());return num('쌓기 블록','그림은 각 기둥이 바닥부터 빈틈없이 쌓인 블록이다. 전체 블록 수는?',a,'각 기둥의 높이 합: '+h.map(r=>r.join('+')).join(' ; ')+' = '+a,cubes(h))};
gen['숨은 블록']=()=>{let n=R(3,5),m=R(3,5),h=R(3,5),a=(n-2)*(m-2)*(h-2),matrix=range(n).map(()=>range(m).map(()=>h));return num('숨은 블록',`가로 ${n}개, 세로 ${m}개, 높이 ${h}개의 정육면체 블록을 빈틈없이 쌓았다. 여섯 면 어디에서도 겉면이 보이지 않는 블록은 몇 개인가?`,a,`각 방향에서 양 끝 한 층씩 제외한다. (${n}−2)×(${m}−2)×(${h}−2)=${a}.`,n<=4&&m<=4&&h<=3?cubes(matrix):'',1)};
gen['그림 조각 배열']=()=>{let edges=sh([20,37,54,71,88]),labels=sh(['가','나','다','라']),pieces=range(4).map(i=>`<div><svg viewBox="0 0 64 100" width="64"><rect x="1" y="1" width="62" height="98" fill="#fff" stroke="#566"/><path d="M0 ${edges[i]} C20 ${R(12,90)} 44 ${R(12,90)} 64 ${edges[i+1]}" fill="none" stroke="#243b59" stroke-width="4"/>${i===0?'<circle cx="10" cy="'+edges[i]+'" r="6" fill="#243b59"/>':''}${i===3?'<rect x="50" y="'+(edges[i+1]-5)+'" width="10" height="10" fill="#243b59"/>':''}</svg><br>(${labels[i]})</div>`),a=labels.join('–'),w=new Set;while(w.size<3){let v=sh(labels).join('–');if(v!==a)w.add(v)}return Q('그림 조각 배열','왼쪽의 원 표시에서 오른쪽의 사각형 표시까지 선이 자연스럽게 이어지는 조각 순서는?',a,[...w],`조각 경계의 선 높이를 맞추면 ${a} 순서다.`,`<div class="strips">${sh(pieces).join('')}</div>`)};
const groups={수리:['사칙연산','분수 비교','기본 자료해석','연도별 자료해석','나이 계산','거리·속력','확률','조합'],추리:['수열 추리','문자 추리','규칙 비교','명제 추리','진위 판단','조건 배정','조건 추리'],지각:['기호 분류','문자 배열','숫자 배열','다른 배열 찾기','숫자 범주','쌓기 블록','숨은 블록','다른 도형','같은 도형','그림 조각 배열']},minutes={수리:15,추리:20,지각:10};let state=null,clock=null,practice=false,history=[],errors=[];try{history=JSON.parse(GSATSync.get('gsat_mock_history_v2')||'[]');errors=JSON.parse(GSATSync.get('gsat_mock_errors_v2')||'[]')}catch(e){}function save(){try{GSATSync.set('gsat_mock_history_v2',JSON.stringify(history));GSATSync.set('gsat_mock_errors_v2',JSON.stringify(errors));if(window.GSATSync){GSATSync.changed('gsat_mock_history_v2');GSATSync.changed('gsat_mock_errors_v2')}}catch(e){}}
function makeSet(group,count,typ){let types=typ?[typ]:groups[group],out=[],seen=new Set;while(out.length<count){let t=sh(types);for(let type of t){if(out.length===count)break;let q;for(let j=0;j<60;j++){q=gen[type]();let key=JSON.stringify([q.text,q.stim,q.visual,q.opts.slice().sort()]);if(!seen.has(key)){seen.add(key);break}}out.push(q)}}return out}
function home(){clearInterval(clock);state=null;app.innerHTML=`<section><small>2026년 대비 · 2023년 교재 기준 · 해커스 파랑이 참고</small><h2>오늘의 실전 훈련</h2><div class="grid">${Object.keys(groups).map(g=>`<button class="tile" onclick="setup('${g}')"><strong>${g}</strong>40문항 · ${minutes[g]}분</button>`).join('')}</div><button class="primary wide" onclick="startFull()">전 영역 모의고사 · 120문항 / 45분</button><p class="muted">영역별 시험이 끝나면 다음 영역을 시작합니다. 실제 응시 안내와 시간은 다를 수 있습니다.</p></section><section><h2>유형별 무제한 연습</h2><div class="row"><select id="pg" onchange="types()">${Object.keys(groups).map(g=>`<option>${g}</option>`).join('')}</select><select id="pt"></select></div><button class="primary wide" onclick="startPractice()">랜덤 연습 시작</button><button class="wide" onclick="retryErrors()" ${errors.length?'':'disabled'}>오답 복습 (${errors.length}문제)</button></section><section><h2>최근 모의고사 기록</h2>${history.length?history.slice(0,12).map(h=>`<p>${esc(h.date)} · ${esc(h.group)} <strong>${h.correct}/${h.total}</strong> · 미응답 ${h.blank} · ${h.elapsed}초</p>`).join(''):'<p class="muted">아직 기록이 없습니다.</p>'}</section>`;types();var mode=new URLSearchParams(location.search).get("mode");if(mode==="practice"){app.children[0].style.display="none";document.querySelector("h1").textContent="유형별 연습"}else if(mode==="exam"){app.children[1].style.display="none"}}
function types(){$('pt').innerHTML='<option value="">전체 유형</option>'+groups[$('pg').value].map(t=>`<option>${t}</option>`).join('')}
function setup(g){app.innerHTML=`<section><h2>${g} 모의고사</h2><p>문항 수: 40문항 / 제한 시간: ${minutes[g]}분</p><p>정답과 해설은 제출 후 공개됩니다. 시간 종료 시 자동 제출됩니다. 이전·다음 문항 이동, 건너뛰기, 검토 표시가 가능합니다.</p><button class="primary wide" onclick="begin('${g}',40,${minutes[g]*60})">시험 시작</button><button class="wide" onclick="begin('${g}',10,${minutes[g]*15})">미니 모의고사 · 10문항</button><button class="wide" onclick="home()">돌아가기</button></section>`}
function startFull(){begin('수리',40,900,['추리','지각'],[])}
function startPractice(){let g=$('pg').value,t=$('pt').value;begin(g,1,0,[],[],t,true)}
function retryErrors(){if(errors.length)begin('오답 복습',errors.length,0,[],[],'',true,errors.map(x=>x.q))}
function begin(group,count,secs,queue=[],results=[],typ='',prac=false,qs=null){clearInterval(clock);practice=prac;let now=Date.now();state={group,qs:qs||makeSet(group,count,typ),answers:[],flags:[],times:[],i:0,start:now,entered:now,deadline:secs?now+secs*1000:0,secs,queue,results,typ,prac,checked:false};render();clock=setInterval(tick,200)}
function tick(){if(!state||state.finished)return;let now=Date.now(),v=state.deadline?Math.max(0,Math.ceil((state.deadline-now)/1000)):Math.floor((now-state.entered)/1000);let el=$('timer');if(el){el.textContent=`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;el.classList.toggle('warn',!!state.deadline&&v<=60)}if(state.deadline&&now>=state.deadline)finish(true)}
function render(){let s=state,q=s.qs[s.i],answered=s.answers.filter(x=>x!==undefined).length,locked=s.prac&&s.checked;app.innerHTML=`<div class="sticky"><div class="row"><strong>${s.group} · ${s.prac?'연습':'모의고사'}</strong><span id="timer" class="timer" style="text-align:right">00:00</span></div><small>${s.i+1} / ${s.qs.length}문항 · 응답 ${answered}개 ${s.prac?'':'· 남은 시간'}</small></div><div class="layout"><section><small>${esc(q.type)}</small><p class="question">${esc(q.text)}</p>${q.stim?`<div class="stim">${q.stim}</div>`:''}<div class="options">${q.opts.map((o,i)=>`<button class="option ${s.answers[s.i]===o?'selected':''} ${locked&&o===q.ans?'correct':''} ${locked&&s.answers[s.i]===o&&o!==q.ans?'incorrect':''}" ${locked?'disabled':''} onclick="choose(${i})">${['①','②','③','④','⑤'][i]} ${esc(o)}${q.visual?q.visual[i]:''}</button>`).join('')}</div>${locked?`<div class="stim"><strong>${s.answers[s.i]===q.ans?'정답!':'오답'}</strong><p>정답: ${esc(q.ans)}<br>${esc(q.ex)}</p></div>`:''}<div class="row" style="margin-top:15px"><button onclick="go(-1)" ${s.prac||s.i===0?'disabled':''}>이전</button><button onclick="flag()" ${s.prac?'disabled':''}>${s.flags[s.i]?'★ 검토':'☆ 검토'}</button>${s.prac?`<button class="primary" onclick="practiceNext()" ${locked?'':'disabled'}>다음 문제</button>`:`<button class="primary" onclick="go(1)" ${s.i===s.qs.length-1?'disabled':''}>다음</button>`}</div></section><section><h2>${s.prac?'학습 메뉴':'문항 이동'}</h2>${s.prac?'':`<div class="nav">${s.qs.map((q,i)=>`<button class="${s.answers[i]!==undefined?'done':''} ${s.flags[i]?'flag':''} ${s.i===i?'current':''}" onclick="jump(${i})">${i+1}${s.flags[i]?'★':''}</button>`).join('')}</div><p><small>파랑: 응답 완료 · ★: 검토 필요</small></p><button class="primary wide" onclick="submit()">제출 및 채점</button>`}<button class="wide" onclick="quit()">${s.prac?'연습 종료':'시험 중단'}</button></section></div>`;tick()}
function recordTime(){let s=state;s.times[s.i]=(s.times[s.i]||0)+(Date.now()-s.entered)/1000;s.entered=Date.now()}
function choose(i){let s=state;if(s.deadline&&Date.now()>=s.deadline){finish(true);return}if(s.prac&&s.checked)return;let q=s.qs[s.i];s.answers[s.i]=q.opts[i];if(s.prac){recordTime();s.checked=true;updateError(q,s.answers[s.i]);save()}render()}
function jump(i){if(!state||state.prac)return;recordTime();state.i=i;render()}function go(d){jump(state.i+d)}function flag(){state.flags[state.i]=!state.flags[state.i];render()}
function key(q){return JSON.stringify([q.type,q.text,q.stim,q.visual,q.opts])}function updateError(q,a){let k=key(q);errors=errors.filter(x=>key(x.q)!==k);if(a!==q.ans)errors.unshift({q,a:a===undefined?null:a});errors=errors.slice(0,200)}
function practiceNext(){let s=state;if(!s.checked)return;if(s.group==='오답 복습'){if(s.i+1>=s.qs.length){home();return}s.i++;s.checked=false;s.entered=Date.now();render();return}let t=s.typ||pick(groups[s.group]);let old=key(s.qs[0]);for(let i=0;i<30;i++){s.qs[0]=gen[t]();if(key(s.qs[0])!==old)break}s.answers=[];s.times=[];s.checked=false;s.entered=Date.now();render()}
function quit(){if(state.prac||confirm('현재 시험을 중단할까요? 미제출 답안은 저장되지 않습니다.'))home()}
function submit(){let blank=state.qs.length-state.answers.filter(x=>x!==undefined).length;if(confirm(`미응답 ${blank}문항. 시험을 제출할까요?`))finish(false)}
function finish(auto){let s=state;if(!s||s.finished)return;s.finished=true;clearInterval(clock);recordTime();let correct=0,blank=0,by={};s.qs.forEach((q,i)=>{let a=s.answers[i],b=by[q.type]||(by[q.type]={n:0,c:0,t:0});b.n++;b.t+=s.times[i]||0;if(a===undefined)blank++;if(a===q.ans){correct++;b.c++}updateError(q,a)});let elapsed=Math.min(s.secs||Infinity,Math.round((Date.now()-s.start)/1000));let result={group:s.group,correct,total:s.qs.length,blank,elapsed,date:new Date().toLocaleDateString('ko-KR')};history.unshift(result);history=history.slice(0,100);save();s.results.push(result);let all=s.results,full=all.length>1||s.queue.length>0;app.innerHTML=`<section><small>${auto?'시간 종료 · 자동 제출':'제출 완료'}</small><h2>${s.group} 결과</h2><div class="grid"><div><small>정답</small><div class="stat">${correct}/${s.qs.length}</div></div><div><small>정답률</small><div class="stat">${Math.round(correct/s.qs.length*100)}%</div></div><div><small>미응답</small><div class="stat">${blank}</div></div></div><p>풀이 시간 ${elapsed}초 · 오답 ${s.qs.length-correct-blank}개</p>${full?`<p>전 영역 누적 ${sum(all.map(x=>x.correct))}/${sum(all.map(x=>x.total))}</p>`:''}${s.queue.length?`<button class="primary wide" onclick="nextSection()">다음 영역: ${s.queue[0]}</button>`:''}<button class="wide" onclick="home()">메인으로</button></section><section><h2>유형별 분석</h2>${table(['유형','정답','평균 체류 시간'],Object.entries(by).map(([t,b])=>[t,`${b.c}/${b.n}`,`${(b.t/b.n).toFixed(1)}초`]))}</section><section><h2>정답 및 해설</h2>${s.qs.map((q,i)=>`<details class="review"><summary>${i+1}. ${esc(q.type)} · ${s.answers[i]===q.ans?'정답':s.answers[i]===undefined?'미응답':'오답'}</summary><p class="question">${esc(q.text)}</p>${q.stim}${q.visual?'<div class="options">'+q.visual.map((v,j)=>`<div>${j+1}${v}</div>`).join('')+'</div>':''}<p>내 답: ${esc(s.answers[i]===undefined?'미응답':s.answers[i])}<br>정답: <strong>${esc(q.ans)}</strong><br>${esc(q.ex)}</p></details>`).join('')}</section>`}
function nextSection(){let s=state,g=s.queue[0];begin(g,40,minutes[g]*60,s.queue.slice(1),s.results)}
window.addEventListener('keydown',e=>{if(!state||state.finished||e.repeat)return;if(['1','2','3','4'].includes(e.key)&&Number(e.key)<=state.qs[state.i].opts.length)choose(Number(e.key)-1);if(!state.prac&&e.key==='ArrowRight'&&state.i<state.qs.length-1)go(1);if(!state.prac&&e.key==='ArrowLeft'&&state.i>0)go(-1)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&!state.finished)tick()});home();
</script></body></html>
