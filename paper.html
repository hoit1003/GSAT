function paperLines(c,kind,w,h){c.strokeStyle='#e1e8f0';c.lineWidth=1;if(kind==='grid'||kind==='lined'){let step=kind==='grid'?30:42;c.beginPath();for(let y=step;y<h;y+=step){c.moveTo(0,y);c.lineTo(w,y)}if(kind==='grid')for(let x=step;x<w;x+=step){c.moveTo(x,0);c.lineTo(x,h)}c.stroke()}}

function updateThumb(pg){let c=$('side').querySelector('canvas[data-page="'+pg+'"]');if(!c)return;let p=data[area+':'+pg]||{title:'',cells:[]};c.getContext('2d').drawImage(exportCanvas(p,pg),0,0,c.width,c.height)}function renderThumbs(){$('side').replaceChildren();for(let i=0;i<7;i++){let b=document.createElement('button'),c=document.createElement('canvas');b.className='thumb'+(i===page?' selected':'');b.setAttribute('aria-label',(i+1)+'페이지');c.width=110;c.height=162;c.dataset.page=i;b.append(c,document.createTextNode((i+1)+' · '+(i*6+1)+'–'+Math.min(40,i*6+6)));b.onclick=()=>go(i);$('side').append(b);updateThumb(i)}}function go(n){if(active)endInk();page=Math.max(0,Math.min(6,n));render()}
function tool(m){if(active)endInk();mode=m;for(let k of ['pen','marker','eraser','pan']){$(k).classList.toggle('selected',m===k);$(k).setAttribute('aria-pressed',String(m===k))}$('swatch').style.background=prefs[m]?.color||'#a8b5c6'}
function closePanel(){$('panel').hidden=$('backdrop').hidden=true}function panel(html){$('panel').innerHTML=html;$('panel').hidden=$('backdrop').hidden=false} $('backdrop').onclick=closePanel;
const palette=['#17243c','#2563eb','#d92e38','#16845b','#8b5bc7','#f5d547','#ff9b43','#ed87b1'];function inkPanel(m){if(m==='eraser'){panel('<h3>지우개 설정</h3><label>방식 <select id="eraseKind"><option value="partial">부분 지우개</option><option value="stroke">획 단위 지우개</option></select></label><label>크기 <span id="widthValue"></span><input id="inkWidth" type="range" min="8" max="100" step="2"></label>');$('eraseKind').value=prefs.eraser.kind;$('eraseKind').onchange=e=>{prefs.eraser.kind=e.target.value;savePrefs()};bindRange('inkWidth','widthValue',prefs.eraser,'width');return}if(m!=='pen'&&m!=='marker')m='pen';tool(m);let p=prefs[m];panel('<h3>'+ (m==='pen'?'펜 설정':'형광펜 설정')+'</h3><div class="colors">'+palette.map(x=>`<button data-color="${x}" aria-label="${x}"><span class="swatch" style="background:${x}"></span></button>`).join('')+'</div><label>사용자 색상 <input type="color" id="customColor"></label><label>굵기 <span id="widthValue"></span><input id="inkWidth" type="range" min="'+(m==='pen'?1:8)+'" max="'+(m==='pen'?12:70)+'" step="1"></label>'+(m==='marker'?'<label>투명도 <span id="alphaValue"></span><input id="alpha" type="range" min=".10" max=".60" step=".05"></label>':''));$('customColor').value=p.color;function color(v){p.color=v;$('customColor').value=v;$('swatch').style.background=v;savePrefs()}$('panel').querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>color(b.dataset.color));$('customColor').oninput=e=>color(e.target.value);bindRange('inkWidth','widthValue',p,'width');if(m==='marker')bindRange('alpha','alphaValue',p,'alpha',true)}function bindRange(id,label,p,k,pct=false){let el=$(id);el.value=p[k];function update(){p[k]=Number(el.value);$(label).textContent=pct?Math.round(p[k]*100)+'%':p[k];savePrefs()}el.oninput=update;update()}
for(let m of ['pen','marker','eraser'])$(m).onclick=()=>{if(mode===m)inkPanel(m);else tool(m)};$('pan').onclick=()=>tool('pan');$('ink').onclick=()=>inkPanel(mode);function pencilUI(){$('pencil').classList.toggle('selected',prefs.penOnly);$('pencil').setAttribute('aria-pressed',String(prefs.penOnly));$('pencil').title=prefs.penOnly?'펜슬만 필기 켜짐 · 손가락으로 이동':'손가락 필기 허용'}$('pencil').onclick=()=>{prefs.penOnly=!prefs.penOnly;savePrefs();pencilUI();$('status').textContent=prefs.penOnly?'펜슬만 필기 · 손가락으로 이동':'손가락 필기 허용'};
$('paperSettings').onclick=()=>{panel('<h3>현재 페이지 용지</h3>'+[['gsat','GSAT 전용 · 6칸 / 정답란'],['blank','무지'],['grid','모눈'],['lined','줄노트']].map(([k,v])=>`<button class="wide" data-paper="${k}">${(current().paper||'gsat')===k?'✓ ':''}${v}</button>`).join('')+'<p class="hint">용지를 바꿔도 기존 필기와 정답은 유지됩니다. 자유 용지는 번호와 정답란만 숨깁니다.</p>');$('panel').querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{let before=snapshot();current().paper=b.dataset.paper;record(before);save();closePanel();render(false)})};
$('undo').onclick=()=>travel('undo','redo');$('redo').onclick=()=>travel('redo','undo');$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('area').onchange=()=>{if(active)endInk();area=$('area').value;page=0;render()};$('title').onchange=()=>{let before=snapshot();current().title=$('title').value;record(before);save();updateThumb(page)};$('sidebar').onclick=()=>{$('side').hidden=!$('side').hidden;$('sidebar').classList.toggle('selected',!$('side').hidden);fit()};$('zoomIn').onclick=()=>zoom(scale*1.2);$('zoomOut').onclick=()=>zoom(scale/1.2);$('fit').onclick=fit;$('home').onclick=()=>location.href='index.html?v=350';
function download(url,name){let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}$('more').onclick=()=>{panel('<h3>페이지 관리</h3><button class="wide" id="export">PNG 이미지 저장</button><button class="wide" id="print">현재 페이지 인쇄</button><button class="wide" id="backup">전체 필기 JSON 백업</button><button class="wide danger" id="clear">현재 페이지 지우기</button><p class="hint">필기는 이 기기에만 저장됩니다. 백업 파일은 원본 데이터를 보관하기 위한 것입니다.</p>');$('export').onclick=()=>{closePanel();download(exportCanvas(current(),page).toDataURL('image/png'),'GSAT_'+area+'_'+(page+1)+'.png')};$('print').onclick=()=>{closePanel();window.print()};$('backup').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));download(u,'GSAT-paper-backup.json');setTimeout(()=>URL.revokeObjectURL(u),30000);closePanel()};$('clear').onclick=()=>{if(!confirm('현재 페이지의 필기와 정답을 모두 지울까요? 실행 취소할 수 있습니다.'))return;let before=snapshot();current().cells=[];record(before);save();closePanel();render(false)}};
let duration=0,elapsed=0,started=0,running=false;function tick(){let t=elapsed+(running?(Date.now()-started)/1000:0),v=Math.floor(duration?Math.max(0,duration-t):t);$('timer').textContent=String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');if(duration&&t>=duration&&running){running=false;elapsed=duration;icon('start');$('start').disabled=true;$('status').textContent='시간 종료'}}function reset(){elapsed=0;running=false;$('start').disabled=false;icon('start');$('start').setAttribute('aria-label','시작');tick()}$('start').onclick=()=>{if(running){elapsed+=(Date.now()-started)/1000;running=false}else{started=Date.now();running=true}icon('start',running?'pause':'start');$('start').setAttribute('aria-label',running?'일시정지':'시작 / 계속');tick()};$('reset').onclick=reset;$('timerSettings').onclick=()=>{panel('<h3>타이머 설정</h3><select id="duration"><option value="0">스톱워치</option><option value="600">10분</option><option value="900">15분</option><option value="1200">20분</option><option value="2700">45분</option></select><button class="wide" id="applyTime">적용 (타이머 초기화)</button>');$('duration').value=duration;$('applyTime').onclick=()=>{duration=Number($('duration').value);reset();closePanel()}};setInterval(tick,200);
window.addEventListener('resize',fit);window.addEventListener('keydown',e=>{if(e.target.closest('input,select'))return;if(e.key==='Escape')closePanel();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();travel(e.shiftKey?'redo':'undo',e.shiftKey?'undo':'redo')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();travel('redo','undo')}});if(innerWidth<650)$('side').hidden=true;$('sidebar').classList.toggle('selected',!$('side').hidden);tool('pen');pencilUI();render();tick();if(readError)$('status').textContent='기존 데이터 읽기 실패 · 덮어쓰기 차단';
</script></body></html>
