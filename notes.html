<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSAT 오답노트</title><link rel="stylesheet" href="theme.css"><script src="config.js?v=3"></script><script src="sync.js?v=360"></script><script src="notes.js?v=360"></script><style>section{padding:18px;margin:14px 0}button,input,textarea,select{border-radius:8px;padding:9px}textarea{width:100%;background:#202c3e;color:#edf3ff;border:1px solid #35445b}button{cursor:pointer;margin:3px}input{max-width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.q{white-space:pre-wrap;font-size:21px;overflow-wrap:anywhere}canvas{width:100%;max-width:720px;height:auto;background:white;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:8px}iframe{width:100%;border:0;background:white;border-radius:8px}small{display:block}details{margin:10px 0}summary{cursor:pointer}label{display:block;margin:8px 0}</style></head><body><main><a href="index.html?v=360">‹ GSAT 홈</a><h1>오답노트</h1><p id="summary"></p><section><div class="row"><select id="group"><option>전체</option><option>암산</option><option>수리</option><option>추리</option><option>지각</option><option>교재</option></select><select id="status"><option value="all">전체 상태</option><option value="todo">복습 필요</option><option value="done">복습 완료</option></select><button id="reload">새로고침</button></div><details><summary>교재 오답 직접 등록</summary><label>유형 <input id="type" placeholder="거리·속력 등"></label><label>문제 / 교재 페이지<textarea id="question"></textarea></label><label>내 답 <input id="myanswer"></label><label>정답 <input id="answer"></label><label>공식 및 해설<textarea id="explain"></textarea></label><button id="add">등록</button></details></section><section><h2>취약 유형</h2><p>3.6.0 이후 채점 기준 (이전 기록은 분모 미확인)</p><div id="stats"></div></section><div id="list"></div></main><script>
const $=id=>document.getElementById(id),N=GSATNotes;let x;const el=(tag,t)=>{let e=document.createElement(tag);if(t!==undefined)e.textContent=t;return e};function btn(t,f){let b=el('button',t);b.onclick=f;return b}function render(){x=N.get();$('summary').textContent=`누적 오답 ${x.items.length}개 · 복습 필요 ${x.items.filter(n=>n.streak<3).length}개 · 완료 ${x.items.filter(n=>n.streak>=3).length}개`;$('stats').replaceChildren();for(let [k,b] of Object.entries(x.stats).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n))$('stats').append(el('p',`${k} · 오답 ${b.w}/${b.n} (${Math.round(100*b.w/b.n)}%)`));$('list').replaceChildren();for(let n of x.items.filter(n=>($('group').value==='전체'||n.group===$('group').value)&&($('status').value==='all'||($('status').value==='done')===(n.streak>=3)))){let s=el('section');s.append(el('small',`${n.group} · ${n.q.type} · 오답 ${n.wrong}회 · 연속 정답 ${n.streak}/3`));let q=el('p',n.q.text);q.className='q';s.append(q);if(n.q.stim||n.q.visual){let frame=el('iframe');frame.setAttribute('sandbox','');frame.srcdoc='<meta charset="utf-8"><style>body{font:15px sans-serif}svg{max-width:100%;height:auto}td,th{border:1px solid #aaa;padding:6px}</style>'+(n.q.stim||'')+(n.q.visual||[]).join('');s.append(frame)}let d=el('details');d.append(el('summary','내 답 · 정답 · 공식 및 해설'),el('p','내 답: '+(n.last??'미응답 / 미기록')),el('p','정답: '+n.q.ans),el('p',n.q.ex||'해설 미등록'));s.append(d);let memo=el('textarea');memo.placeholder='오답 원인 / 풀이 메모';memo.value=n.memo||'';s.append(memo,btn('메모 저장',()=>{let z=N.get(),a=z.items.find(a=>a.id===n.id);if(a){a.memo=memo.value;if(N.save(z))alert('저장 완료')}}));if(n.q.manual){let a=el('input');a.placeholder='다시 풀고 정답 입력';s.append(a,btn('채점',()=>{let ok=a.value.trim()===String(n.q.ans).trim();N.log(n.group,n.q,a.value,ok);alert(ok?'정답!':'오답');render()}))}else{let url=(n.q.mental?'mental.html':'mock.html')+'?v=360&note='+encodeURIComponent(n.id);s.append(btn('다시 풀기',()=>location.href=url));if(!n.q.mental)s.append(btn('같은 유형 새 문제',()=>location.href=url+'&similar=1'));else s.append(btn('같은 유형 새 문제',()=>location.href=url+'&similar=1'));}let ink=el('details');ink.append(el('summary','Apple Pencil 풀이'));let c=el('canvas');c.width=720;c.height=420;ink.append(c);let ctx=c.getContext('2d'),lines=Array.isArray(n.ink)?n.ink:[],active=null;function draw(){ctx.clearRect(0,0,720,420);ctx.strokeStyle='#17243c';ctx.lineWidth=3;ctx.lineCap='round';for(let line of lines){if(!line.length)continue;ctx.beginPath();ctx.moveTo(...line[0]);for(let p of line)ctx.lineTo(...p);ctx.lineTo(line[0][0]+.01,line[0][1]);if(line.length>1){ctx.beginPath();ctx.moveTo(...line[0]);for(let p of line)ctx.lineTo(...p)}ctx.stroke()}}function point(e){let r=c.getBoundingClientRect();return [Math.round((e.clientX-r.left)*720/r.width),Math.round((e.clientY-r.top)*420/r.height)]}function persist(){let z=N.get(),a=z.items.find(a=>a.id===n.id);if(a){a.ink=lines;N.save(z)}}c.onpointerdown=e=>{if(active!==null||e.pointerType==='touch')return;e.preventDefault();active=e.pointerId;c.setPointerCapture(active);lines.push([point(e)]);draw()};c.onpointermove=e=>{if(e.pointerId!==active)return;e.preventDefault();lines.at(-1).push(point(e));draw()};c.onpointerup=c.onpointercancel=e=>{if(e.pointerId===active){active=null;persist()}};c.oncontextmenu=e=>e.preventDefault();ink.append(btn('마지막 획 지우기',()=>{lines.pop();draw();persist()}));draw();s.append(ink);$('list').append(s)}}$('group').onchange=$('status').onchange=$('reload').onclick=render;$('add').onclick=()=>{let text=$('question').value.trim(),ans=$('answer').value.trim();if(!text||!ans)return alert('문제와 정답을 입력하세요');let q={type:$('type').value||'교재',text,ans,ex:$('explain').value,manual:true};N.log('교재',q,$('myanswer').value,false);render()};N.importOld();render();</script></body></html>
